<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="김민재의 작업 노트 안에서 즐기는 갤러그 스타일 전투기 슈팅 미니 게임">
  <title>갤러그 미니 게임 — 김민재의 작업 노트</title>
  <style>
    :root{
      --bg:#f7f8fc; --panel:#ffffff; --line:#d9deea;
      --text:#1a1f2e; --muted:#51586b; --accent:#2f5bea; --accent-dark:#1e3fb5;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
      line-height:1.7;
    }
    a{ color:var(--accent-dark); }
    a:focus-visible, button:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }

    header{ border-bottom:1px solid var(--line); background:#ffffffee; }
    .bar{
      max-width:720px; margin:0 auto; padding:14px 20px;
      display:flex; justify-content:space-between; align-items:center; gap:16px;
    }
    .brand{ font-weight:800; color:var(--text); text-decoration:none; }
    .bar a.back{ color:var(--muted); text-decoration:none; font-weight:600; }
    .bar a.back:hover{ color:var(--accent-dark); text-decoration:underline; }

    main{ max-width:720px; margin:0 auto; padding:28px 20px 60px; }
    h1{ font-size:clamp(1.8rem,5vw,2.4rem); margin:0 0 6px; }
    .lead{ color:var(--muted); margin:0 0 20px; }

    .game-wrap{
      background:var(--panel); border:1px solid var(--line); border-radius:18px;
      padding:18px; box-shadow:0 10px 26px rgba(47,91,234,.12);
    }
    canvas{
      display:block; width:100%; height:auto; background:#060814;
      border-radius:12px; touch-action:none;
    }

    .hud{
      display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center;
      margin:14px 0 6px; font-weight:700;
    }
    .hud .level{ color:#8a4bd6; }
    .hud .score{ color:var(--accent-dark); }
    .hud .best{ color:var(--muted); font-weight:600; }
    .hud .lives{ color:#d14b6a; }
    .hud #state{ color:var(--accent-dark); }

    .controls{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    .btn{
      display:inline-block; border:none; cursor:pointer; font:inherit; font-weight:800;
      background:var(--accent); color:#fff; padding:11px 22px; border-radius:10px;
      transition:transform .12s ease, background .12s ease;
    }
    .btn:hover{ transform:translateY(-2px); background:var(--accent-dark); }
    .btn.secondary{ background:var(--panel); color:var(--accent-dark); border:1px solid var(--accent); }
    .btn.secondary:hover{ background:#eef1ff; }

    .how{
      margin-top:22px; background:var(--panel); border:1px solid var(--line);
      border-radius:14px; padding:18px 20px;
    }
    .how h2{ font-size:1.1rem; margin:0 0 10px; color:var(--accent-dark); }
    .how ul{ margin:0; padding-left:20px; }
    .how li{ margin-bottom:6px; }
    .note{ color:var(--muted); font-size:.95rem; margin-top:16px; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="./index.html">김민재의 작업 노트</a>
      <a class="back" href="./index.html#work-galaga">← 작업 설명으로 돌아가기</a>
    </div>
  </header>

  <main>
    <h1>갤러그 미니 게임</h1>
    <p class="lead">전투기를 조종해 적 편대를 레이저로 격추하세요.</p>

    <div class="game-wrap">
      <canvas id="game" width="480" height="640" aria-label="갤러그 스타일 전투기 슈팅 게임 화면" role="img"></canvas>

      <div class="hud">
        <span class="level">레벨: <span id="level">1</span></span>
        <span class="score">점수: <span id="score">0</span></span>
        <span class="best">최고: <span id="best">0</span></span>
        <span class="lives">기체: <span id="lives">3</span></span>
        <span id="state" aria-live="polite"></span>
      </div>

      <div class="controls">
        <button id="start" class="btn" type="button">게임 시작</button>
        <button id="pause" class="btn secondary" type="button" disabled>일시정지</button>
      </div>
    </div>

    <section class="how">
      <h2>조작 방법</h2>
      <ul>
        <li>← → 방향키 또는 A / D : 좌우 이동</li>
        <li>스페이스바 : 레이저 발사 (꾹 누르면 연사)</li>
        <li>휴대폰 : 화면을 좌우로 터치해 이동, 두 손가락 탭으로 발사</li>
      </ul>
      <p class="note">기체가 3대 있어요. 적 레이저에 맞거나 적이 바닥까지 내려오면 1대를 잃습니다.</p>
    </section>
  </main>

  <script>
    (function () {
      var canvas = document.getElementById("game");
      var ctx = canvas.getContext("2d");
      var W = canvas.width, H = canvas.height;

      var scoreEl = document.getElementById("score");
      var bestEl = document.getElementById("best");
      var livesEl = document.getElementById("lives");
      var stateEl = document.getElementById("state");
      var levelEl = document.getElementById("level");
      var startBtn = document.getElementById("start");
      var pauseBtn = document.getElementById("pause");

      var BEST_KEY = "galaga_best";

      var running = false, paused = false, over = false;
      var score = 0, lives = 3, level = 1;
      var best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = best;

      // 적 종류별 설정
      // grunt: 기본, dasher: 빠른 돌격형, tank: 중장갑, boss: 대형 보스
      var ENEMY = {
        grunt:  { w: 34, h: 28, hp: 1, color: "#ff7a6b", score: 10 },
        dasher: { w: 26, h: 22, hp: 1, color: "#8ff07a", score: 15 },
        tank:   { w: 44, h: 36, hp: 3, color: "#c79bff", score: 30 },
        boss:   { w: 120, h: 80, hp: 40, color: "#ff4d6d", score: 300 }
      };

      var player, bullets, enemies, enemyBullets, particles, stars;
      var keys, touchDir, tick, enemyDir, invuln, boss, bossTimer;

      // ---- 초기화 ----
      function makeStars() {
        stars = [];
        for (var i = 0; i < 70; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.6 + 0.4,
            sp: Math.random() * 0.6 + 0.3
          });
        }
      }

      function reset(full) {
        player = { x: W / 2, y: H - 64, w: 40, h: 34, speed: 3.2, cooldown: 0 };
        bullets = [];
        enemies = [];
        enemyBullets = [];
        particles = [];
        keys = {};
        touchDir = 0;
        tick = 0;
        enemyDir = 1;
        invuln = 0;
        over = false;
        boss = null;
        bossTimer = 0;
        if (full) { score = 0; lives = 3; level = 1; }
        scoreEl.textContent = score;
        livesEl.textContent = lives;
        levelEl.textContent = level;
        spawnWave();
      }

      function makeEnemy(type, x, y) {
        var def = ENEMY[type];
        return {
          type: type, x: x, y: y, w: def.w, h: def.h,
          hp: def.hp, maxhp: def.hp, color: def.color, score: def.score,
          alive: true, phase: Math.random() * Math.PI * 2
        };
      }

      // 레벨마다 편대 구성이 달라지고, 5레벨마다 보스가 나온다
      function spawnWave() {
        enemies = [];
        boss = null;

        if (level % 5 === 0) {
          // 보스 레벨: 대형 전투기 + 소수 호위기
          boss = makeEnemy("boss", W / 2 - ENEMY.boss.w / 2, 60);
          enemies.push(boss);
          for (var g = 0; g < 4; g++) {
            enemies.push(makeEnemy("grunt", 70 + g * 110, 170));
          }
          setState("보스 등장!");
          return;
        }

        // 일반 레벨: 레벨이 오를수록 강한 적 비율이 늘어난다
        var cols = 6, rows = 3, startX = 56, gapX = 74, startY = 66, gapY = 52;
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            var type = "grunt";
            var roll = Math.random();
            // 맨 윗줄은 튼튼한 중장갑형이 섞일 확률
            if (r === 0 && roll < 0.2 + level * 0.04) type = "tank";
            // 아랫줄은 빠른 돌격형이 섞일 확률
            else if (r === rows - 1 && roll < 0.2 + level * 0.05) type = "dasher";
            var def = ENEMY[type];
            var x = startX + c * gapX + (ENEMY.grunt.w - def.w) / 2;
            var y = startY + r * gapY;
            enemies.push(makeEnemy(type, x, y));
          }
        }
      }

      function setState(t) { stateEl.textContent = t; }

      function rectsHit(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x &&
               a.y < b.y + b.h && a.y + a.h > b.y;
      }

      // 플레이어 충돌 박스 (player.x/y 는 중심 기준이라 좌상단으로 변환)
      function playerBox() {
        return {
          x: player.x - player.w / 2,
          y: player.y - player.h / 2,
          w: player.w,
          h: player.h
        };
      }

      function shoot() {
        if (player.cooldown > 0) return;
        // 좌우 2줄기 레이저
        bullets.push({ x: player.x - 11, y: player.y - 18, w: 3, h: 20, speed: 9 });
        bullets.push({ x: player.x + 8, y: player.y - 18, w: 3, h: 20, speed: 9 });
        player.cooldown = 10;
      }

      // 적 레이저 생성 헬퍼 (vx, vy 로 방향 지정)
      function fireStraight(x, y, speed) {
        enemyBullets.push({ x: x - 2, y: y, w: 4, h: 14, vx: 0, vy: speed, big: false });
      }
      function fireAngled(x, y, angleOffset, speed) {
        // angleOffset: 아래(+y) 기준 좌우 기울기(라디안 근사)
        enemyBullets.push({ x: x - 2, y: y, w: 4, h: 12, vx: Math.sin(angleOffset) * speed, vy: Math.cos(angleOffset) * speed, big: false });
      }
      // 보스: 부채꼴로 여러 갈래 레이저 발사
      function fireBossSpread() {
        if (!boss) return;
        var cx = boss.x + boss.w / 2, cy = boss.y + boss.h;
        var count = 5 + Math.min(4, Math.floor(level / 5)); // 레벨 오를수록 갈래 증가
        var spread = 1.1; // 전체 부채 각(라디안)
        var speed = 3 + level * 0.1;
        for (var i = 0; i < count; i++) {
          var t = count === 1 ? 0 : (i / (count - 1) - 0.5); // -0.5~0.5
          var ang = t * spread;
          enemyBullets.push({
            x: cx - 3, y: cy, w: 6, h: 16,
            vx: Math.sin(ang) * speed, vy: Math.cos(ang) * speed, big: true
          });
        }
      }

      function burst(x, y, color) {
        for (var i = 0; i < 14; i++) {
          var ang = Math.random() * Math.PI * 2;
          var sp = Math.random() * 3 + 1;
          particles.push({
            x: x, y: y,
            vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
            life: 1, color: color
          });
        }
      }

      // ---- 입력 ----
      document.addEventListener("keydown", function (e) {
        if (["ArrowLeft", "ArrowRight", " ", "Spacebar"].indexOf(e.key) !== -1) e.preventDefault();
        keys[e.key] = true;
      });
      document.addEventListener("keyup", function (e) { keys[e.key] = false; });

      canvas.addEventListener("touchstart", handleTouch, { passive: false });
      canvas.addEventListener("touchmove", handleTouch, { passive: false });
      canvas.addEventListener("touchend", function (e) {
        e.preventDefault();
        if (e.touches.length === 0) touchDir = 0;
      }, { passive: false });
      function handleTouch(e) {
        e.preventDefault();
        if (!running || paused || over) return;
        var rect = canvas.getBoundingClientRect();
        var t = e.touches[0];
        var x = (t.clientX - rect.left) / rect.width * W;
        touchDir = x < W / 2 ? -1 : 1;
        if (e.touches.length >= 2) shoot();
      }

      // ---- 업데이트 ----
      function update() {
        tick++;
        if (player.cooldown > 0) player.cooldown--;
        if (invuln > 0) invuln--;

        for (var si = 0; si < stars.length; si++) {
          stars[si].y += stars[si].sp;
          if (stars[si].y > H) { stars[si].y = 0; stars[si].x = Math.random() * W; }
        }

        var left = keys["ArrowLeft"] || keys["a"] || keys["A"] || touchDir === -1;
        var right = keys["ArrowRight"] || keys["d"] || keys["D"] || touchDir === 1;
        if (left) player.x -= player.speed;
        if (right) player.x += player.speed;
        player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

        var firing = keys[" "] || keys["Spacebar"];
        if (firing) shoot();

        for (var i = bullets.length - 1; i >= 0; i--) {
          bullets[i].y -= bullets[i].speed;
          if (bullets[i].y + bullets[i].h < 0) bullets.splice(i, 1);
        }

        // 편대(보스 제외) 좌우 이동: 레벨이 오를수록 조금씩 빨라짐
        var speedX = 0.35 + level * 0.07;
        var hitEdge = false;
        for (var j = 0; j < enemies.length; j++) {
          var en = enemies[j];
          if (!en.alive || en.type === "boss") continue;
          var sp = speedX;
          if (en.type === "dasher") { en.y += 0.5 + level * 0.05; sp *= 1.6; } // 돌격형은 아래로도 전진
          en.x += enemyDir * sp;
          if (en.x < 8 || en.x + en.w > W - 8) hitEdge = true;
        }
        if (hitEdge) {
          enemyDir *= -1;
          for (var k = 0; k < enemies.length; k++) {
            if (enemies[k].alive && enemies[k].type !== "boss") enemies[k].y += 12;
          }
        }

        // 보스: 천천히 좌우로 떠다니며 주기적으로 여러 갈래 레이저 발사
        if (boss && boss.alive) {
          boss.x += Math.sin(tick * 0.02) * 1.4;
          boss.x = Math.max(8, Math.min(W - boss.w - 8, boss.x));
          bossTimer++;
          var interval = Math.max(45, 90 - level * 2);
          if (bossTimer >= interval) {
            bossTimer = 0;
            fireBossSpread();
          }
        }

        // 일반 적 발사: 드물게 (레벨이 오를수록 잦아짐). tank는 추가로 더 쏨
        var fireEvery = Math.max(28, 70 - level * 3);
        if (tick % fireEvery === 0) {
          var alive = enemies.filter(function (e2) { return e2.alive && e2.type !== "boss"; });
          if (alive.length) {
            var sh = alive[Math.floor(Math.random() * alive.length)];
            fireStraight(sh.x + sh.w / 2, sh.y + sh.h, 2.6 + level * 0.12);
            if (sh.type === "tank") {
              // 중장갑형은 좌우로 살짝 벌어진 2발 추가
              fireAngled(sh.x + sh.w / 2, sh.y + sh.h, -0.25, 2.6);
              fireAngled(sh.x + sh.w / 2, sh.y + sh.h, 0.25, 2.6);
            }
          }
        }

        // 적 레이저 이동 (vx, vy)
        for (var b = enemyBullets.length - 1; b >= 0; b--) {
          enemyBullets[b].x += enemyBullets[b].vx;
          enemyBullets[b].y += enemyBullets[b].vy;
          if (enemyBullets[b].y > H || enemyBullets[b].x < -20 || enemyBullets[b].x > W + 20) {
            enemyBullets.splice(b, 1);
          }
        }

        // 내 레이저 vs 적 (hp 적용)
        for (var bi = bullets.length - 1; bi >= 0; bi--) {
          for (var ei = 0; ei < enemies.length; ei++) {
            var e3 = enemies[ei];
            if (!e3.alive || !rectsHit(bullets[bi], e3)) continue;
            var hx = bullets[bi].x;
            bullets.splice(bi, 1);
            e3.hp--;
            burst(hx, e3.y + 6, "255,220,120");
            if (e3.hp <= 0) {
              e3.alive = false;
              burst(e3.x + e3.w / 2, e3.y + e3.h / 2, e3.type === "boss" ? "255,80,110" : "255,120,90");
              score += e3.score;
              scoreEl.textContent = score;
              if (e3 === boss) { boss = null; setState("보스 격파! +" + e3.score); }
            }
            break;
          }
        }

        // 웨이브 클리어 → 레벨업
        if (enemies.length && enemies.every(function (e4) { return !e4.alive; })) {
          enemies = [];
          level++;
          levelEl.textContent = level;
          setState("레벨 " + level + " !");
          spawnWave();
        }

        // 적 레이저 vs 플레이어
        var pbox = playerBox();
        for (var eb = enemyBullets.length - 1; eb >= 0; eb--) {
          if (invuln === 0 && rectsHit(enemyBullets[eb], pbox)) {
            enemyBullets.splice(eb, 1);
            hitPlayer();
            return;
          }
        }
        // 적이 바닥 접근
        for (var ee = 0; ee < enemies.length; ee++) {
          if (enemies[ee].alive && enemies[ee].y + enemies[ee].h >= pbox.y) {
            hitPlayer();
            return;
          }
        }

        // 파티클
        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.04; pt.life -= 0.02;
          if (pt.life <= 0) particles.splice(p, 1);
        }
      }

      function hitPlayer() {
        burst(player.x, player.y, "124,156,255");
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) { endGame(); return; }
        // 피격 후 잠깐 무적 + 적 레이저 비우기
        invuln = 90;
        enemyBullets = [];
        player.x = W / 2;
        setState("기체 손상! 남은 기체 " + lives);
      }

      // ---- 그리기 ----
      function drawPlayer() {
        if (invuln > 0 && Math.floor(tick / 5) % 2 === 0) return; // 깜빡임
        var x = player.x, y = player.y;
        ctx.save();
        ctx.translate(x, y);

        // 엔진 불꽃
        var flame = 8 + Math.sin(tick * 0.5) * 4;
        var g = ctx.createLinearGradient(0, 10, 0, 10 + flame);
        g.addColorStop(0, "rgba(255,210,120,0.9)");
        g.addColorStop(1, "rgba(255,90,60,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(-5, 10); ctx.lineTo(5, 10); ctx.lineTo(0, 10 + flame);
        ctx.closePath(); ctx.fill();

        // 동체
        ctx.fillStyle = "#cfe0ff";
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(5, 6);
        ctx.lineTo(-5, 6);
        ctx.closePath();
        ctx.fill();
        // 주 날개
        ctx.fillStyle = "#6f9bff";
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.lineTo(20, 10);
        ctx.lineTo(8, 10);
        ctx.lineTo(0, 4);
        ctx.lineTo(-8, 10);
        ctx.lineTo(-20, 10);
        ctx.closePath();
        ctx.fill();
        // 꼬리 날개
        ctx.fillStyle = "#3f6fe0";
        ctx.beginPath();
        ctx.moveTo(0, 2); ctx.lineTo(7, 12); ctx.lineTo(-7, 12);
        ctx.closePath(); ctx.fill();
        // 콕핏
        ctx.fillStyle = "#eaf1ff";
        ctx.beginPath();
        ctx.ellipse(0, -8, 2.6, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawEnemy(e) {
        if (e.type === "boss") { drawBoss(e); return; }
        var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
        var sx = e.w / 34; // 기준 크기(grunt) 대비 스케일
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(sx, sx);

        if (e.type === "dasher") {
          // 돌격형: 날렵한 화살 모양 (초록)
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.moveTo(0, 14); ctx.lineTo(10, -8); ctx.lineTo(0, -2); ctx.lineTo(-10, -8);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = "#2f7a3a";
          ctx.beginPath(); ctx.ellipse(0, 2, 2, 3.5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          return;
        }

        if (e.type === "tank") {
          // 중장갑형: 넓고 두꺼운 보라 기체
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.moveTo(0, 8); ctx.lineTo(22, -10); ctx.lineTo(9, -10);
          ctx.lineTo(0, -4); ctx.lineTo(-9, -10); ctx.lineTo(-22, -10);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = "#e7d6ff";
          ctx.fillRect(-7, -10, 14, 16);
          ctx.fillStyle = "#5e2f9e";
          ctx.beginPath(); ctx.ellipse(0, 2, 3, 4.5, 0, 0, Math.PI * 2); ctx.fill();
          // 남은 체력 힌트(피격 시 색 번짐)
          if (e.hp < e.maxhp) {
            ctx.fillStyle = "rgba(255,80,80,0.5)";
            ctx.fillRect(-10, 8, 20 * (1 - e.hp / e.maxhp), 3);
          }
          ctx.restore();
          return;
        }

        // 기본(grunt)
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(0, 6); ctx.lineTo(18, -8); ctx.lineTo(7, -8);
        ctx.lineTo(0, -2); ctx.lineTo(-7, -8); ctx.lineTo(-18, -8);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#ffd36b";
        ctx.beginPath();
        ctx.moveTo(0, 15); ctx.lineTo(5, -8); ctx.lineTo(-5, -8);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#b03a52";
        ctx.beginPath(); ctx.ellipse(0, 4, 2.4, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawBoss(e) {
        var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
        ctx.save();
        ctx.translate(cx, cy);
        // 본체
        ctx.fillStyle = "#2a0d16";
        ctx.fillRect(-e.w / 2, -e.h / 2, e.w, e.h);
        // 장갑 패널
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(0, e.h / 2);
        ctx.lineTo(e.w / 2, -e.h / 4);
        ctx.lineTo(e.w / 4, -e.h / 2);
        ctx.lineTo(-e.w / 4, -e.h / 2);
        ctx.lineTo(-e.w / 2, -e.h / 4);
        ctx.closePath(); ctx.fill();
        // 발광 코어
        var glow = 10 + Math.sin(tick * 0.2) * 6;
        ctx.save();
        ctx.shadowColor = "rgba(255,80,110,0.9)";
        ctx.shadowBlur = glow;
        ctx.fillStyle = "#ffd0da";
        ctx.beginPath(); ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        // 포구 3개
        ctx.fillStyle = "#ffe08a";
        ctx.fillRect(-e.w / 2 + 14, e.h / 2 - 6, 8, 6);
        ctx.fillRect(-4, e.h / 2 - 6, 8, 6);
        ctx.fillRect(e.w / 2 - 22, e.h / 2 - 6, 8, 6);
        ctx.restore();

        // 체력바 (상단 중앙)
        var bw = e.w, bh = 6, bx = e.x, by = e.y - 12;
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = "#ff5a7a";
        ctx.fillRect(bx, by, bw * Math.max(0, e.hp / e.maxhp), bh);
      }

      function drawLaser(b, core, glow) {
        ctx.save();
        ctx.shadowColor = glow;
        ctx.shadowBlur = 12;
        ctx.fillStyle = core;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.restore();
      }

      function draw() {
        // 배경 그라데이션
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, "#0a1230");
        bg.addColorStop(1, "#050711");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // 별
        for (var s = 0; s < stars.length; s++) {
          var st = stars[s];
          ctx.fillStyle = "rgba(255,255,255," + (0.3 + st.r * 0.35) + ")";
          ctx.fillRect(st.x, st.y, st.r, st.r);
        }

        // 적 레이저: 일반은 빨강, 보스 탄은 분홍 굵은 빔
        for (var i = 0; i < enemyBullets.length; i++) {
          if (enemyBullets[i].big) {
            drawLaser(enemyBullets[i], "#ff86b0", "rgba(255,100,150,0.95)");
          } else {
            drawLaser(enemyBullets[i], "#ff5a5a", "rgba(255,90,90,0.9)");
          }
        }
        // 내 레이저 (청록 빔)
        for (var j = 0; j < bullets.length; j++) {
          drawLaser(bullets[j], "#8ffcff", "rgba(120,220,255,0.9)");
        }

        // 적
        for (var k = 0; k < enemies.length; k++) {
          if (enemies[k].alive) drawEnemy(enemies[k]);
        }

        // 파티클
        for (var p = 0; p < particles.length; p++) {
          var pt = particles[p];
          ctx.fillStyle = "rgba(" + pt.color + "," + Math.max(0, pt.life) + ")";
          ctx.fillRect(pt.x, pt.y, 3, 3);
        }

        drawPlayer();
      }

      function loop() {
        if (!running) return;
        if (!paused && !over) { update(); draw(); }
        requestAnimationFrame(loop);
      }

      function startGame() {
        reset(true);
        running = true; paused = false;
        startBtn.textContent = "다시 시작";
        pauseBtn.disabled = false;
        pauseBtn.textContent = "일시정지";
        setState("");
        requestAnimationFrame(loop);
      }

      function togglePause() {
        if (!running || over) return;
        paused = !paused;
        pauseBtn.textContent = paused ? "계속하기" : "일시정지";
        setState(paused ? "일시정지됨" : "");
      }

      function endGame() {
        over = true;
        running = false;
        pauseBtn.disabled = true;
        if (score > best) {
          best = score;
          localStorage.setItem(BEST_KEY, String(best));
          bestEl.textContent = best;
          setState("게임 오버 — 최고 점수 경신!");
        } else {
          setState("게임 오버");
        }
        startBtn.textContent = "다시 시작";
      }

      startBtn.addEventListener("click", startGame);
      pauseBtn.addEventListener("click", togglePause);

      // 시작 전 안내 화면
      makeStars();
      reset(true);
      running = false;
      draw();
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("게임 시작을 눌러 주세요", W / 2, H / 2);
      ctx.textAlign = "start";
    })();
  </script>
</body>
</html>
