<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="김민재의 작업 노트 안에서 즐기는 갤러그 스타일 전투기 슈팅 미니 게임">
  <title>갤러그 미니 게임 — 김민재의 작업 노트</title>
  <style>
    :root{
      --bg:#f7f8fc; --panel:#ffffff; --line:#d9deea;
      --text:#1a1f2e; --muted:#51586b; --accent:#2f5bea; --accent-dark:#1e3fb5;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
      line-height:1.7;
    }
    a{ color:var(--accent-dark); }
    a:focus-visible, button:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }

    header{ border-bottom:1px solid var(--line); background:#ffffffee; }
    .bar{
      max-width:720px; margin:0 auto; padding:14px 20px;
      display:flex; justify-content:space-between; align-items:center; gap:16px;
    }
    .brand{ font-weight:800; color:var(--text); text-decoration:none; }
    .bar a.back{ color:var(--muted); text-decoration:none; font-weight:600; }
    .bar a.back:hover{ color:var(--accent-dark); text-decoration:underline; }

    main{ max-width:720px; margin:0 auto; padding:28px 20px 60px; }
    h1{ font-size:clamp(1.8rem,5vw,2.4rem); margin:0 0 6px; }
    .lead{ color:var(--muted); margin:0 0 20px; }

    .game-wrap{
      background:var(--panel); border:1px solid var(--line); border-radius:18px;
      padding:18px; box-shadow:0 10px 26px rgba(47,91,234,.12);
    }
    canvas{
      display:block; width:100%; height:auto; background:#060814;
      border-radius:12px; touch-action:none;
    }

    .hud{
      display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center;
      margin:14px 0 6px; font-weight:700;
    }
    .hud .score{ color:var(--accent-dark); }
    .hud .best{ color:var(--muted); font-weight:600; }
    .hud .lives{ color:#d14b6a; }
    .hud #state{ color:var(--accent-dark); }

    .controls{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    .btn{
      display:inline-block; border:none; cursor:pointer; font:inherit; font-weight:800;
      background:var(--accent); color:#fff; padding:11px 22px; border-radius:10px;
      transition:transform .12s ease, background .12s ease;
    }
    .btn:hover{ transform:translateY(-2px); background:var(--accent-dark); }
    .btn.secondary{ background:var(--panel); color:var(--accent-dark); border:1px solid var(--accent); }
    .btn.secondary:hover{ background:#eef1ff; }

    .how{
      margin-top:22px; background:var(--panel); border:1px solid var(--line);
      border-radius:14px; padding:18px 20px;
    }
    .how h2{ font-size:1.1rem; margin:0 0 10px; color:var(--accent-dark); }
    .how ul{ margin:0; padding-left:20px; }
    .how li{ margin-bottom:6px; }
    .note{ color:var(--muted); font-size:.95rem; margin-top:16px; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="./index.html">김민재의 작업 노트</a>
      <a class="back" href="./index.html#work-galaga">← 작업 설명으로 돌아가기</a>
    </div>
  </header>

  <main>
    <h1>갤러그 미니 게임</h1>
    <p class="lead">전투기를 조종해 적 편대를 레이저로 격추하세요.</p>

    <div class="game-wrap">
      <canvas id="game" width="480" height="640" aria-label="갤러그 스타일 전투기 슈팅 게임 화면" role="img"></canvas>

      <div class="hud">
        <span class="score">점수: <span id="score">0</span></span>
        <span class="best">최고: <span id="best">0</span></span>
        <span class="lives">기체: <span id="lives">3</span></span>
        <span id="state" aria-live="polite"></span>
      </div>

      <div class="controls">
        <button id="start" class="btn" type="button">게임 시작</button>
        <button id="pause" class="btn secondary" type="button" disabled>일시정지</button>
      </div>
    </div>

    <section class="how">
      <h2>조작 방법</h2>
      <ul>
        <li>← → 방향키 또는 A / D : 좌우 이동</li>
        <li>스페이스바 : 레이저 발사 (꾹 누르면 연사)</li>
        <li>휴대폰 : 화면을 좌우로 터치해 이동, 두 손가락 탭으로 발사</li>
      </ul>
      <p class="note">기체가 3대 있어요. 적 레이저에 맞거나 적이 바닥까지 내려오면 1대를 잃습니다.</p>
    </section>
  </main>

  <script>
    (function () {
      var canvas = document.getElementById("game");
      var ctx = canvas.getContext("2d");
      var W = canvas.width, H = canvas.height;

      var scoreEl = document.getElementById("score");
      var bestEl = document.getElementById("best");
      var livesEl = document.getElementById("lives");
      var stateEl = document.getElementById("state");
      var startBtn = document.getElementById("start");
      var pauseBtn = document.getElementById("pause");

      var BEST_KEY = "galaga_best";

      var running = false, paused = false, over = false;
      var score = 0, lives = 3, wave = 1;
      var best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = best;

      var player, bullets, enemies, enemyBullets, particles, stars;
      var keys, touchDir, tick, enemyDir, invuln;

      // ---- 초기화 ----
      function makeStars() {
        stars = [];
        for (var i = 0; i < 70; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.6 + 0.4,
            sp: Math.random() * 0.6 + 0.3
          });
        }
      }

      function reset(full) {
        player = { x: W / 2, y: H - 64, w: 40, h: 34, speed: 3.2, cooldown: 0 };
        bullets = [];
        enemies = [];
        enemyBullets = [];
        particles = [];
        keys = {};
        touchDir = 0;
        tick = 0;
        enemyDir = 1;
        invuln = 0;
        over = false;
        if (full) { score = 0; lives = 3; wave = 1; }
        scoreEl.textContent = score;
        livesEl.textContent = lives;
        spawnWave();
      }

      function spawnWave() {
        var cols = 6, rows = 3, startX = 60, gapX = 72, startY = 70, gapY = 54;
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            enemies.push({
              x: startX + c * gapX, y: startY + r * gapY,
              w: 34, h: 28, alive: true,
              row: r, phase: Math.random() * Math.PI * 2
            });
          }
        }
      }

      function setState(t) { stateEl.textContent = t; }

      function rectsHit(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x &&
               a.y < b.y + b.h && a.y + a.h > b.y;
      }

      // 플레이어 충돌 박스 (player.x/y 는 중심 기준이라 좌상단으로 변환)
      function playerBox() {
        return {
          x: player.x - player.w / 2,
          y: player.y - player.h / 2,
          w: player.w,
          h: player.h
        };
      }

      function shoot() {
        if (player.cooldown > 0) return;
        // 좌우 2줄기 레이저
        bullets.push({ x: player.x - 11, y: player.y - 18, w: 3, h: 20, speed: 9 });
        bullets.push({ x: player.x + 8, y: player.y - 18, w: 3, h: 20, speed: 9 });
        player.cooldown = 10;
      }

      function burst(x, y, color) {
        for (var i = 0; i < 14; i++) {
          var ang = Math.random() * Math.PI * 2;
          var sp = Math.random() * 3 + 1;
          particles.push({
            x: x, y: y,
            vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
            life: 1, color: color
          });
        }
      }

      // ---- 입력 ----
      document.addEventListener("keydown", function (e) {
        if (["ArrowLeft", "ArrowRight", " ", "Spacebar"].indexOf(e.key) !== -1) e.preventDefault();
        keys[e.key] = true;
      });
      document.addEventListener("keyup", function (e) { keys[e.key] = false; });

      canvas.addEventListener("touchstart", handleTouch, { passive: false });
      canvas.addEventListener("touchmove", handleTouch, { passive: false });
      canvas.addEventListener("touchend", function (e) {
        e.preventDefault();
        if (e.touches.length === 0) touchDir = 0;
      }, { passive: false });
      function handleTouch(e) {
        e.preventDefault();
        if (!running || paused || over) return;
        var rect = canvas.getBoundingClientRect();
        var t = e.touches[0];
        var x = (t.clientX - rect.left) / rect.width * W;
        touchDir = x < W / 2 ? -1 : 1;
        if (e.touches.length >= 2) shoot();
      }

      // ---- 업데이트 ----
      function update() {
        tick++;
        if (player.cooldown > 0) player.cooldown--;
        if (invuln > 0) invuln--;

        for (var si = 0; si < stars.length; si++) {
          stars[si].y += stars[si].sp;
          if (stars[si].y > H) { stars[si].y = 0; stars[si].x = Math.random() * W; }
        }

        var left = keys["ArrowLeft"] || keys["a"] || keys["A"] || touchDir === -1;
        var right = keys["ArrowRight"] || keys["d"] || keys["D"] || touchDir === 1;
        if (left) player.x -= player.speed;
        if (right) player.x += player.speed;
        player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

        var firing = keys[" "] || keys["Spacebar"];
        if (firing) shoot();

        for (var i = bullets.length - 1; i >= 0; i--) {
          bullets[i].y -= bullets[i].speed;
          if (bullets[i].y + bullets[i].h < 0) bullets.splice(i, 1);
        }

        // 적 이동: 천천히 좌우로, 가벼운 물결 흔들림
        var speedX = 0.35 + wave * 0.08;
        var hitEdge = false;
        for (var j = 0; j < enemies.length; j++) {
          var en = enemies[j];
          if (!en.alive) continue;
          en.x += enemyDir * speedX;
          if (en.x < 8 || en.x + en.w > W - 8) hitEdge = true;
        }
        if (hitEdge) {
          enemyDir *= -1;
          for (var k = 0; k < enemies.length; k++) {
            if (enemies[k].alive) enemies[k].y += 12;
          }
        }

        // 적 발사: 드물게
        if (tick % 70 === 0) {
          var alive = enemies.filter(function (e2) { return e2.alive; });
          if (alive.length) {
            var sh = alive[Math.floor(Math.random() * alive.length)];
            enemyBullets.push({ x: sh.x + sh.w / 2 - 2, y: sh.y + sh.h, w: 4, h: 14, speed: 2.6 + wave * 0.15 });
          }
        }
        for (var b = enemyBullets.length - 1; b >= 0; b--) {
          enemyBullets[b].y += enemyBullets[b].speed;
          if (enemyBullets[b].y > H) enemyBullets.splice(b, 1);
        }

        // 내 레이저 vs 적
        for (var bi = bullets.length - 1; bi >= 0; bi--) {
          for (var ei = 0; ei < enemies.length; ei++) {
            var e3 = enemies[ei];
            if (e3.alive && rectsHit(bullets[bi], e3)) {
              e3.alive = false;
              burst(e3.x + e3.w / 2, e3.y + e3.h / 2, "255,120,90");
              bullets.splice(bi, 1);
              score += 10;
              scoreEl.textContent = score;
              break;
            }
          }
        }

        // 웨이브 클리어
        if (enemies.length && enemies.every(function (e4) { return !e4.alive; })) {
          enemies = [];
          wave++;
          setState("웨이브 " + wave + " !");
          spawnWave();
        }

        // 적 레이저 vs 플레이어
        var pbox = playerBox();
        for (var eb = enemyBullets.length - 1; eb >= 0; eb--) {
          if (invuln === 0 && rectsHit(enemyBullets[eb], pbox)) {
            enemyBullets.splice(eb, 1);
            hitPlayer();
            return;
          }
        }
        // 적이 바닥 접근
        for (var ee = 0; ee < enemies.length; ee++) {
          if (enemies[ee].alive && enemies[ee].y + enemies[ee].h >= pbox.y) {
            hitPlayer();
            return;
          }
        }

        // 파티클
        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.04; pt.life -= 0.02;
          if (pt.life <= 0) particles.splice(p, 1);
        }
      }

      function hitPlayer() {
        burst(player.x, player.y, "124,156,255");
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) { endGame(); return; }
        // 피격 후 잠깐 무적 + 적 레이저 비우기
        invuln = 90;
        enemyBullets = [];
        player.x = W / 2;
        setState("기체 손상! 남은 기체 " + lives);
      }

      // ---- 그리기 ----
      function drawPlayer() {
        if (invuln > 0 && Math.floor(tick / 5) % 2 === 0) return; // 깜빡임
        var x = player.x, y = player.y;
        ctx.save();
        ctx.translate(x, y);

        // 엔진 불꽃
        var flame = 8 + Math.sin(tick * 0.5) * 4;
        var g = ctx.createLinearGradient(0, 10, 0, 10 + flame);
        g.addColorStop(0, "rgba(255,210,120,0.9)");
        g.addColorStop(1, "rgba(255,90,60,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(-5, 10); ctx.lineTo(5, 10); ctx.lineTo(0, 10 + flame);
        ctx.closePath(); ctx.fill();

        // 동체
        ctx.fillStyle = "#cfe0ff";
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(5, 6);
        ctx.lineTo(-5, 6);
        ctx.closePath();
        ctx.fill();
        // 주 날개
        ctx.fillStyle = "#6f9bff";
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.lineTo(20, 10);
        ctx.lineTo(8, 10);
        ctx.lineTo(0, 4);
        ctx.lineTo(-8, 10);
        ctx.lineTo(-20, 10);
        ctx.closePath();
        ctx.fill();
        // 꼬리 날개
        ctx.fillStyle = "#3f6fe0";
        ctx.beginPath();
        ctx.moveTo(0, 2); ctx.lineTo(7, 12); ctx.lineTo(-7, 12);
        ctx.closePath(); ctx.fill();
        // 콕핏
        ctx.fillStyle = "#eaf1ff";
        ctx.beginPath();
        ctx.ellipse(0, -8, 2.6, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawEnemy(e) {
        var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
        ctx.save();
        ctx.translate(cx, cy);
        // 아래를 향한 적 전투기
        // 날개
        ctx.fillStyle = "#ff7a6b";
        ctx.beginPath();
        ctx.moveTo(0, 6);
        ctx.lineTo(18, -8);
        ctx.lineTo(7, -8);
        ctx.lineTo(0, -2);
        ctx.lineTo(-7, -8);
        ctx.lineTo(-18, -8);
        ctx.closePath();
        ctx.fill();
        // 동체 (아래로 뾰족)
        ctx.fillStyle = "#ffd36b";
        ctx.beginPath();
        ctx.moveTo(0, 15);
        ctx.lineTo(5, -8);
        ctx.lineTo(-5, -8);
        ctx.closePath();
        ctx.fill();
        // 콕핏
        ctx.fillStyle = "#b03a52";
        ctx.beginPath();
        ctx.ellipse(0, 4, 2.4, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawLaser(b, core, glow) {
        ctx.save();
        ctx.shadowColor = glow;
        ctx.shadowBlur = 12;
        ctx.fillStyle = core;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.restore();
      }

      function draw() {
        // 배경 그라데이션
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, "#0a1230");
        bg.addColorStop(1, "#050711");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // 별
        for (var s = 0; s < stars.length; s++) {
          var st = stars[s];
          ctx.fillStyle = "rgba(255,255,255," + (0.3 + st.r * 0.35) + ")";
          ctx.fillRect(st.x, st.y, st.r, st.r);
        }

        // 적 레이저 (빨강 빔)
        for (var i = 0; i < enemyBullets.length; i++) {
          drawLaser(enemyBullets[i], "#ff5a5a", "rgba(255,90,90,0.9)");
        }
        // 내 레이저 (청록 빔)
        for (var j = 0; j < bullets.length; j++) {
          drawLaser(bullets[j], "#8ffcff", "rgba(120,220,255,0.9)");
        }

        // 적
        for (var k = 0; k < enemies.length; k++) {
          if (enemies[k].alive) drawEnemy(enemies[k]);
        }

        // 파티클
        for (var p = 0; p < particles.length; p++) {
          var pt = particles[p];
          ctx.fillStyle = "rgba(" + pt.color + "," + Math.max(0, pt.life) + ")";
          ctx.fillRect(pt.x, pt.y, 3, 3);
        }

        drawPlayer();
      }

      function loop() {
        if (!running) return;
        if (!paused && !over) { update(); draw(); }
        requestAnimationFrame(loop);
      }

      function startGame() {
        reset(true);
        running = true; paused = false;
        startBtn.textContent = "다시 시작";
        pauseBtn.disabled = false;
        pauseBtn.textContent = "일시정지";
        setState("");
        requestAnimationFrame(loop);
      }

      function togglePause() {
        if (!running || over) return;
        paused = !paused;
        pauseBtn.textContent = paused ? "계속하기" : "일시정지";
        setState(paused ? "일시정지됨" : "");
      }

      function endGame() {
        over = true;
        running = false;
        pauseBtn.disabled = true;
        if (score > best) {
          best = score;
          localStorage.setItem(BEST_KEY, String(best));
          bestEl.textContent = best;
          setState("게임 오버 — 최고 점수 경신!");
        } else {
          setState("게임 오버");
        }
        startBtn.textContent = "다시 시작";
      }

      startBtn.addEventListener("click", startGame);
      pauseBtn.addEventListener("click", togglePause);

      // 시작 전 안내 화면
      makeStars();
      reset(true);
      running = false;
      draw();
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("게임 시작을 눌러 주세요", W / 2, H / 2);
      ctx.textAlign = "start";
    })();
  </script>
</body>
</html>
